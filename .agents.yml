# Agent toolkit config — installs repo-specific skills (uv + VCMI maps domain) and
# the local-worker `research` workflow that runs the gate-loop benchmark program.
repo:
  name: vcmi-mapgen
agents:
  claude: true
packs:
  - vcmi-mapgen
localInstructions:
  - skill: vcmi-mapgen          # always-loaded repo-root CLAUDE.md (uv + pipeline)
    paths: ["."]
    includeReadme: none
  - skill: vcmi-mapgen-maps     # loaded when working under src/ (formats, metrics, graph)
    paths: ["src"]
workflow:
  branch: main
