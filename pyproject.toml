[project]
name = "vcmi-mapgen"
version = "0.1.0"
description = "Shape-driven VCMI zone-rebuilding engine + learned terrain generator"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",  # editor-quality H3 sprite rendering (vcmi_mapgen/render_editor.py)
    "numpy>=1.26",  # terrain segmentation + zone transform math
    "torch>=2.2",  # learned vegetation GAN (vcmi_mapgen/veg_gan.py); CPU-only, see [tool.uv] below
]

# Pin torch to the CPU wheel index — the default index resolves torch>=2.2 to a multi-GB
# CUDA build (+ triton). The GAN is CPU-first; the CPU wheels are small and need no GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# pytest in the PROJECT env so `uv run pytest` shares torch (the GAN tests need it);
# uv installs the `dev` group by default for `uv run`/`uv sync`.
[dependency-groups]
dev = ["pytest>=8"]

# Everything else is the Python standard library. Run via uv, e.g.:
#   uv run python -m vcmi_mapgen.zone_engine run "All for One"
#   uv run python -m vcmi_mapgen.markov_terrain
#   uv run pytest
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pre-existing codebase style — do not touch these in bulk:
#   E401/E402: multi-import lines + sys.path hacks before third-party imports
#   F401: imports used for side-effects or available to callers without __all__
#   E741: `l` used throughout as "level" variable name
#   F841: intermediate computations stored but not always read
#   E731: lambdas assigned to local helpers (idiom in embedding/noise code)
#   E722: bare except in resilient loaders
#   F821/F601/F541: minor pre-existing issues
ignore = ["E401", "E402", "F401", "E741", "F841", "E731", "E722", "F821", "F601", "F541"]

[tool.pytest.ini_options]
testpaths = ["vcmi_mapgen"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
