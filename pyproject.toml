[project]
name = "vcmi-mapgen"
version = "0.1.0"
description = "Hand-made-feel VCMI map generator + research benchmark"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",   # rendering schematic PNGs (src/deps_render.py, deps_showcase.py)
    "numpy>=1.26,<2",  # array math; <2 for torch 2.2 (compiled against numpy 1.x)
    "torch>=2.2.0,<2.3.0",  # CPU-only; trains the terrain->placement heatmap CNN from scratch
]

# Everything else the generator/benchmark uses is the Python standard library.
# Run anything with uv, e.g.:
#   uv run python src/benchmark.py --maps 12 --seeds 10
#   uv run python src/deps_realize.py 4
[tool.uv]
package = false

# CPU torch build. Avoids the ~1.3GB nvidia_* CUDA wheels and keeps training honest
# about running on CPU (the user's constraint).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pre-existing codebase style — do not touch these in bulk:
#   E401/E402: multi-import lines + sys.path hacks before third-party imports
#   F401: imports used for side-effects or available to callers without __all__
#   E741: `l` used throughout as "level" variable name
#   F841: intermediate computations stored but not always read
#   E731: lambdas assigned to local helpers (idiom in embedding/noise code)
#   E722: bare except in resilient loaders
#   F821/F601/F541: minor pre-existing issues
ignore = ["E401", "E402", "F401", "E741", "F841", "E731", "E722", "F821", "F601", "F541"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
