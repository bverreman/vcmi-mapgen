# Agent toolkit config — installs repo-specific skills (uv + VCMI maps domain) for
# the zone-rebuilding engine + learned terrain generator.
repo:
  name: vcmi-mapgen
agents:
  claude: true
packs:
  - vcmi-mapgen
  - cli-writer
localInstructions:
  - skills:
      - vcmi-mapgen
      - cli-writer # always-loaded repo-root CLAUDE.md (uv + pipeline)
    paths: ["."]
    includeReadme: none
  - skill: vcmi-mapgen-maps # loaded when working under vcmi_mapgen/ (formats, engine, rendering)
    paths: ["vcmi_mapgen"]
workflow:
  branch: main
